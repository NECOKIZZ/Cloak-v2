# Cloak v2 keeper on Render's free plan (Blueprint: New > Blueprint, this repo). The site is on Vercel (apps/web).
# Testnet values from deployments/elysium-testnet-gloam.json. For mainnet, swap in the mainnet addresses and blocks.
# Free plan notes (docs/OPTIMIZATION.md):
#   - Render stops a free service after 15 minutes with no incoming request. The keeper requests its own address
#     (RENDER_EXTERNAL_URL, set by Render) every 10 minutes only while it has work pending, so it sleeps when idle and
#     the site's first request wakes it (about a minute).
#   - Memory is lost when it sleeps or redeploys: queued withdrawal pieces are handed back by the site.
services:
  - type: web
    name: cloak-v2-keeper
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloakely/sdk build
    startCommand: node services/keeper/index.mjs
    healthCheckPath: /health
    # rebuild only when something the keeper runs changes (site, docs, contracts and e2e pushes skip the deploy)
    buildFilter:
      paths:
        - services/keeper/**
        - packages/sdk/**
        - deployments/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the keeper and relayer key: set in Render's dashboard, never in the repo
      - key: KEEPER_PK
        sync: false
      # Cloak's launch registry (launches, reveals, settles, the site's snapshot)
      - key: CONFIG
        value: "0x9fdf166f0671166148ea98cdd3ef0118d256167f"
      - key: CLAIM_DELAY
        value: "3600"
      - key: CORS_ORIGINS
        value: "https://gloak.boblabs.tech,http://localhost:5173"
      # one proxy (Render's) in front: the client IP for rate limits comes from it (review O-03)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Gloam's vault (Cloak's instance on testnet) and Cloak's launch vault
      - key: GLOAM_VAULT
        value: "0x8D15BA46071D5AB2e59d746c22d51C906281cB44"
      - key: GLOAM_VAULT_BLOCK
        value: "26230337"
      - key: GLOAM_LAUNCH_VAULT
        value: "0x8e38155ae9e753874415482e1ab1c169bbc7d1a2"
      - key: GLOAM_LAUNCH_VAULT_BLOCK
        value: "26230337"
      - key: GLOAM_MEMO
        value: "0xf6816854b68CC4B67213289927d8e44050BA62D3"
      # Cloak's escrows the relay sends for: launch swap v4, batcher v4, bids, receive, graduation, funds gate
      - key: GLOAM_ESCROWS
        value: "0xd540527d3eef9b4de63f741159036d5e35204541,0x2681a81fdfbb447a297ac5fd5bba0a2ffc599f54,0xe07d0f72c07f2f18e8d4089a857361b282128c5d,0x8ef40f47cf991acd7ee7f4c77c505c909b9367a8,0x8bb5a381f31e2114838cc3dcd876a2ae0775f98d,0x1642422970782e5d1b0a94a64ee022e2c3b4a25c"
      - key: GLOAM_BATCHER_V4
        value: "0x2681a81fdfbb447a297ac5fd5bba0a2ffc599f54"
      - key: GLOAM_BATCHER_V4_BLOCK
        value: "26581546"
      - key: GLOAM_FUNDS_GATE
        value: "0x1642422970782e5d1b0a94a64ee022e2c3b4a25c"
